<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Worth It logo: a double check mark">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#27946f"/>
      <stop offset="1" stop-color="#145540"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="226" fill="url(#bg)"/>
  <!-- "Think twice": the first check fades back, the second is the one you commit to. -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="112">
    <path d="M200 440 L360 600 L720 190" opacity="0.38"/>
    <path d="M320 630 L480 790 L840 380"/>
  </g>
</svg>
